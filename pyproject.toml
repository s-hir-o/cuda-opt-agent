[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuda-opt-agent"
version = "0.1.0"
description = "CUDA kernel auto-optimization platform"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0",
    "structlog>=23.0",
    # API / CLI
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "typer>=0.9",
    "rich>=13.0",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # LLM providers
    "anthropic>=0.39",
    "openai>=1.6",
    "httpx>=0.25",
    # Numerics
    "numpy>=1.26",
    # Async
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*utcnow.*:DeprecationWarning",
    "ignore:.*shadows an attribute.*:UserWarning",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: tests requiring real GPU (deselect with '-m \"not gpu\"')",
    "slow: slow-running tests",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]


