<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Kernel Optimization Agent Architecture</title>
  <desc id="desc">Runtime architecture showing baseline characterization, candidate synthesis, deterministic evaluation gates, persistence, and the iterative optimization loop.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2029" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#768397"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#76b900"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#e5a84b"/>
    </marker>
    <style>
      .title { font: 700 36px "Segoe UI", Arial, sans-serif; fill: #f4f7fb; letter-spacing: 0; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #8f9bad; letter-spacing: 0; }
      .eyebrow { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #aab4c3; letter-spacing: 1.7px; }
      .stage { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #d7dee8; letter-spacing: 1.4px; }
      .cardTitle { font: 650 19px "Segoe UI", Arial, sans-serif; fill: #f1f5f9; letter-spacing: 0; }
      .cardSub { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #9ba7b8; letter-spacing: 0; }
      .mono { font: 500 12px Consolas, "Courier New", monospace; fill: #718096; letter-spacing: 0; }
      .chip { font: 700 10px "Segoe UI", Arial, sans-serif; letter-spacing: 1px; }
      .flowLabel { font: 600 11px "Segoe UI", Arial, sans-serif; fill: #7f8b9c; letter-spacing: .8px; }
      .metric { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #c7d0dc; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#090c11"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.5"/>
  <rect x="0" y="0" width="8" height="1080" fill="#76b900"/>

  <g transform="translate(58 39)">
    <rect x="0" y="0" width="50" height="50" rx="6" fill="#121821" stroke="#354152"/>
    <path d="M13 15H37M13 25H29M13 35H37" fill="none" stroke="#76b900" stroke-width="3" stroke-linecap="square"/>
    <circle cx="37" cy="25" r="4" fill="#57c4d8"/>
  </g>
  <text x="126" y="65" class="title">CUDA KERNEL OPTIMIZATION AGENT</text>
  <text x="127" y="91" class="subtitle">Architecture and runtime data flow &#183; profiling-informed candidate search with deterministic evaluation gates</text>
  <g transform="translate(1600 48)">
    <rect width="260" height="38" rx="6" fill="#111720" stroke="#2b3543"/>
    <circle cx="22" cy="19" r="5" fill="#76b900"/>
    <text x="38" y="24" class="mono" fill="#aeb9c8">cuda_opt_agent</text>
  </g>

  <rect x="44" y="116" width="1832" height="920" rx="10" fill="#0d1118" stroke="#303a48" stroke-width="1.5"/>
  <rect x="44" y="116" width="1832" height="36" rx="10" fill="#151b24"/>
  <path d="M44 142V126Q44 116 54 116H1866Q1876 116 1876 126V142Z" fill="#151b24"/>
  <text x="72" y="139" class="eyebrow">COORDINATOR</text>
  <text x="190" y="139" class="mono">agents/coordinator.py :: Coordinator.optimize()</text>
  <g transform="translate(1640 127)">
    <circle cx="0" cy="0" r="4" fill="#76b900"/>
    <text x="12" y="4" class="flowLabel">ORCHESTRATED PIPELINE</text>
  </g>

  <!-- Stage 1: baseline characterization -->
  <rect x="72" y="164" width="1776" height="230" rx="7" fill="#10151d" stroke="#28313e"/>
  <rect x="72" y="164" width="5" height="230" fill="#57c4d8"/>
  <text x="96" y="195" class="stage">01  BASELINE CHARACTERIZATION</text>
  <text x="1778" y="195" class="flowLabel" text-anchor="end">SOURCE &#8594; BUILD &#8594; PROFILE &#8594; ANALYZE</text>

  <g filter="url(#shadow)">
    <rect x="100" y="222" width="250" height="132" rx="6" fill="#151b24" stroke="#3d4a5c"/>
    <rect x="100" y="222" width="250" height="4" fill="#76b900"/>
    <rect x="116" y="242" width="52" height="20" rx="3" fill="#243315"/>
    <text x="142" y="256" class="chip" fill="#9ad43a" text-anchor="middle">INPUT</text>
    <text x="116" y="287" class="cardTitle">CUDA Source</text>
    <text x="116" y="310" class="cardSub">Kernel + host-runnable harness</text>
    <text x="116" y="335" class="mono">schemas/kernel.py</text>
  </g>

  <path d="M350 288H380" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="388" y="222" width="265" height="132" rx="6" fill="#151b24" stroke="#3d4a5c"/>
    <rect x="388" y="222" width="265" height="4" fill="#57c4d8"/>
    <rect x="404" y="242" width="58" height="20" rx="3" fill="#153039"/>
    <text x="433" y="256" class="chip" fill="#6ed4e6" text-anchor="middle">BUILD</text>
    <text x="404" y="287" class="cardTitle">NVCC</text>
    <text x="404" y="310" class="cardSub">PTX + host executable artifacts</text>
    <text x="404" y="335" class="mono">build/nvcc_runner.py</text>
  </g>

  <path d="M653 288H683" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="691" y="222" width="280" height="132" rx="6" fill="#151b24" stroke="#3d4a5c"/>
    <rect x="691" y="222" width="280" height="4" fill="#e5a84b"/>
    <rect x="707" y="242" width="70" height="20" rx="3" fill="#392a17"/>
    <text x="742" y="256" class="chip" fill="#efbc69" text-anchor="middle">PROFILE</text>
    <text x="707" y="287" class="cardTitle">Nsight Compute</text>
    <text x="707" y="310" class="cardSub">GPU metrics via NCU runner/parser</text>
    <text x="707" y="335" class="mono">profiling/ncu_runner.py</text>
  </g>

  <path d="M971 288H1001" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1009" y="222" width="390" height="132" rx="6" fill="#151b24" stroke="#3d4a5c"/>
    <rect x="1009" y="222" width="390" height="4" fill="#9a8fe8"/>
    <rect x="1025" y="242" width="76" height="20" rx="3" fill="#272440"/>
    <text x="1063" y="256" class="chip" fill="#b3a9f0" text-anchor="middle">ANALYZE</text>
    <text x="1025" y="287" class="cardTitle">Feature Extraction</text>
    <text x="1025" y="310" class="cardSub">CUDA source &#183; PTX &#183; NCU &#183; occupancy</text>
    <text x="1025" y="335" class="mono">analysis/* &#183; features/pipeline.py</text>
  </g>

  <path d="M1399 288H1429" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1437" y="222" width="383" height="132" rx="6" fill="#151b24" stroke="#3d4a5c"/>
    <rect x="1437" y="222" width="383" height="4" fill="#e06c75"/>
    <rect x="1453" y="242" width="78" height="20" rx="3" fill="#382126"/>
    <text x="1492" y="256" class="chip" fill="#ed9299" text-anchor="middle">CLASSIFY</text>
    <text x="1453" y="287" class="cardTitle">Cost + Bottleneck Model</text>
    <text x="1453" y="310" class="cardSub">Rule-based optimization context</text>
    <text x="1453" y="335" class="mono">cost_models/* &#183; bottleneck_agent.py</text>
  </g>

  <!-- Stage 2: candidate synthesis -->
  <rect x="72" y="416" width="1776" height="225" rx="7" fill="#10151d" stroke="#28313e"/>
  <rect x="72" y="416" width="5" height="225" fill="#76b900"/>
  <text x="96" y="445" class="stage">02  CANDIDATE SYNTHESIS</text>
  <text x="1778" y="445" class="flowLabel" text-anchor="end">TWO CONTROLLED SOURCES &#8594; ONE VARIANT CONTRACT</text>

  <!-- Baseline analysis fans out into both controlled candidate sources. -->
  <path d="M1628 354V463H335V479" fill="none" stroke="#4d596b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M845 463V479" fill="none" stroke="#4d596b" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="1071" y="450" width="170" height="25" rx="4" fill="#0d1118" stroke="#2b3543"/>
  <text x="1156" y="467" class="flowLabel" text-anchor="middle">OPTIMIZATION CONTEXT</text>

  <g filter="url(#shadow)">
    <rect x="100" y="479" width="470" height="126" rx="6" fill="#151b24" stroke="#4e6727"/>
    <rect x="100" y="479" width="470" height="4" fill="#76b900"/>
    <rect x="116" y="498" width="68" height="20" rx="3" fill="#243315"/>
    <text x="150" y="512" class="chip" fill="#9ad43a" text-anchor="middle">PRIMARY</text>
    <text x="116" y="543" class="cardTitle">Transform Search</text>
    <text x="116" y="566" class="cardSub">Grid search over registered CUDA transforms</text>
    <text x="116" y="588" class="mono">search/grid_search.py &#183; transforms/registry.py</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="610" y="479" width="470" height="126" rx="6" fill="#151b24" stroke="#806233" stroke-dasharray="7 5"/>
    <rect x="610" y="479" width="470" height="4" fill="#e5a84b"/>
    <rect x="626" y="498" width="78" height="20" rx="3" fill="#392a17"/>
    <text x="665" y="512" class="chip" fill="#efbc69" text-anchor="middle">FALLBACK</text>
    <text x="626" y="543" class="cardTitle">LLM Candidate Generation</text>
    <text x="626" y="566" class="cardSub">Full CUDA source when search is exhausted</text>
    <text x="626" y="588" class="mono">agents/generator_agent.py &#183; llm/providers</text>
  </g>

  <path d="M570 542V623H1146V558" fill="none" stroke="#76b900" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M1080 574H1120Q1146 574 1146 548" fill="none" stroke="#e5a84b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowAmber)"/>
  <path d="M1154 542H1242" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1138" y="534" width="16" height="16" transform="rotate(45 1146 542)" fill="#202a36" stroke="#748196"/>

  <g filter="url(#shadow)">
    <rect x="1250" y="479" width="570" height="126" rx="6" fill="#151b24" stroke="#3d4a5c"/>
    <rect x="1250" y="479" width="570" height="4" fill="#57c4d8"/>
    <rect x="1266" y="498" width="86" height="20" rx="3" fill="#153039"/>
    <text x="1309" y="512" class="chip" fill="#6ed4e6" text-anchor="middle">NORMALIZE</text>
    <text x="1266" y="543" class="cardTitle">Candidate Variant</text>
    <text x="1266" y="566" class="cardSub">Generated source or applied TransformSpec</text>
    <text x="1266" y="588" class="mono">schemas/kernel.py :: KernelVariant</text>
  </g>

  <!-- Stage 3: deterministic gates -->
  <rect x="72" y="665" width="1776" height="273" rx="7" fill="#10151d" stroke="#28313e"/>
  <rect x="72" y="665" width="5" height="273" fill="#e5a84b"/>
  <text x="96" y="696" class="stage">03  DETERMINISTIC EVALUATION GATES</text>
  <text x="1778" y="696" class="flowLabel" text-anchor="end">COMPILE &#8594; VALIDATE &#8594; MEASURE &#8594; SELECT</text>
  <path d="M1535 605V650H380V727" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="100" y="735" width="290" height="150" rx="6" fill="#151b24" stroke="#3d4a5c"/>
    <rect x="100" y="735" width="290" height="4" fill="#57c4d8"/>
    <text x="116" y="775" class="cardTitle">NVCC Compile</text>
    <text x="116" y="801" class="cardSub">Build candidate executable</text>
    <text x="116" y="827" class="mono">build/nvcc_runner.py</text>
    <text x="116" y="856" class="metric">FAIL CLOSED ON DIAGNOSTICS</text>
  </g>

  <path d="M390 810H412" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="420" y="735" width="290" height="150" rx="6" fill="#151b24" stroke="#4e6727"/>
    <rect x="420" y="735" width="290" height="4" fill="#76b900"/>
    <text x="436" y="775" class="cardTitle">Correctness Validation</text>
    <text x="436" y="801" class="cardSub">Baseline vs candidate output</text>
    <text x="436" y="827" class="mono">correctness/file_runner.py</text>
    <text x="436" y="856" class="metric">ABS / REL TOLERANCE GATE</text>
  </g>

  <path d="M710 810H732" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="740" y="735" width="290" height="150" rx="6" fill="#151b24" stroke="#806233"/>
    <rect x="740" y="735" width="290" height="4" fill="#e5a84b"/>
    <text x="756" y="775" class="cardTitle">Statistical Benchmark</text>
    <text x="756" y="801" class="cardSub">Warmup + repeated timing</text>
    <text x="756" y="827" class="mono">benchmark/runner.py &#183; stats.py</text>
    <text x="756" y="856" class="metric">MEDIAN &#183; P95 &#183; VARIANCE</text>
  </g>

  <path d="M1030 810H1052" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1060" y="735" width="290" height="150" rx="6" fill="#151b24" stroke="#675f98"/>
    <rect x="1060" y="735" width="290" height="4" fill="#9a8fe8"/>
    <text x="1076" y="775" class="cardTitle">Variant Comparator</text>
    <text x="1076" y="801" class="cardSub">Speedup + significance check</text>
    <text x="1076" y="827" class="mono">benchmark/comparator.py</text>
    <text x="1076" y="856" class="metric">BEST VALID VARIANT</text>
  </g>

  <path d="M1350 810H1372" fill="none" stroke="#768397" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1380" y="735" width="440" height="150" rx="6" fill="#182019" stroke="#5e7d2a"/>
    <rect x="1380" y="735" width="440" height="4" fill="#76b900"/>
    <rect x="1740" y="754" width="62" height="20" rx="3" fill="#243315"/>
    <text x="1771" y="768" class="chip" fill="#9ad43a" text-anchor="middle">OUTPUT</text>
    <text x="1396" y="775" class="cardTitle">Optimization Report</text>
    <text x="1396" y="801" class="cardSub">Best source &#183; validated speedup &#183; run history</text>
    <text x="1396" y="827" class="mono">schemas/optimization.py &#183; memory/repositories</text>
    <text x="1396" y="856" class="metric">OptimizationRun + OptimizationIteration</text>
  </g>

  <!-- Iteration loop -->
  <path d="M1205 885V916H90V542H100" fill="none" stroke="#76b900" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <rect x="494" y="902" width="316" height="27" rx="4" fill="#0d1118" stroke="#344225"/>
  <text x="652" y="920" class="flowLabel" fill="#93bb4f" text-anchor="middle">ITERATE UNTIL CONVERGENCE OR BUDGET LIMIT</text>

  <!-- Persistence rail -->
  <rect x="72" y="960" width="1776" height="52" rx="6" fill="#131922" stroke="#2f3947"/>
  <rect x="72" y="960" width="5" height="52" fill="#9a8fe8"/>
  <text x="96" y="991" class="stage">PERSISTENCE</text>
  <text x="245" y="991" class="mono">memory/database.py</text>
  <text x="463" y="991" class="cardSub">kernel sources</text>
  <circle cx="574" cy="986" r="2.5" fill="#596678"/>
  <text x="594" y="991" class="cardSub">variants</text>
  <circle cx="671" cy="986" r="2.5" fill="#596678"/>
  <text x="691" y="991" class="cardSub">profile metrics</text>
  <circle cx="814" cy="986" r="2.5" fill="#596678"/>
  <text x="834" y="991" class="cardSub">compilation results</text>
  <circle cx="993" cy="986" r="2.5" fill="#596678"/>
  <text x="1013" y="991" class="cardSub">correctness results</text>
  <circle cx="1184" cy="986" r="2.5" fill="#596678"/>
  <text x="1204" y="991" class="cardSub">benchmark results</text>
  <circle cx="1374" cy="986" r="2.5" fill="#596678"/>
  <text x="1394" y="991" class="cardSub">optimization history</text>

  <g transform="translate(72 1048)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#768397" stroke-width="2"/>
    <text x="54" y="4" class="flowLabel">DETERMINISTIC FLOW</text>
    <line x1="220" y1="0" x2="262" y2="0" stroke="#e5a84b" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="274" y="4" class="flowLabel">CONDITIONAL LLM FALLBACK</text>
    <line x1="518" y1="0" x2="560" y2="0" stroke="#76b900" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="572" y="4" class="flowLabel">OPTIMIZATION LOOP</text>
  </g>
  <text x="1848" y="1052" class="mono" text-anchor="end">CLI: Typer &#183; API: FastAPI &#183; Config: Pydantic</text>
</svg>
